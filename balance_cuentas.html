<script>
const D=JSON.parse(document.getElementById('d').textContent);
const f=(n)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n||0);
const cif=(n)=>Number(n||0).toLocaleString('es-AR');
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let q='',from='',to='';
const okReg=(r)=>((!from||!r.fecha||r.fecha>=from)&&(!to||!r.fecha||r.fecha<=to)
  &&(!q||(r.referencia||'').toLowerCase().includes(q)||(r.cliente||'').toLowerCase().includes(q)
     ||(r.flujo||'').toLowerCase().includes(q)||(r.cf||'').toLowerCase().includes(q)));
function decorate(node,path){
  node.cf=(path+' '+node.name).trim().toLowerCase();
  node.children.forEach(c=>decorate(c,node.cf));
  node._regs=node.regs.filter(okReg);
  node._tot=node._regs.reduce((s,r)=>s+(r.total||0),0)+node.children.reduce((s,c)=>s+c._tot,0);
  node._cnt=node._regs.length+node.children.reduce((s,c)=>s+c._cnt,0);
  node._visible=_q(node);
}
function _q(node){
  if(!q)return true;
  if(node._regs.length>0)return true;
  return node.children.some(c=>c._visible&&(q&&c.cf.includes(q)));
}
function build(node,depth){
  if(q&&!node._visible)return '';
  const kids=node.children.map(c=>build(c,depth+1)).join('');
  const hasKids=kids!=='';
  const hasRegs=node._regs.length>0;
  if(q&&!hasKids&&!hasRegs)return '';
  const regsHTML=node._regs.map(r=>
    '<tr><td>'+esc(r.fecha||'')+'</td><td>'+esc(r.referencia||'')+'</td><td>'+esc(r.cliente||'')+'</td>'+
    '<td>'+esc(r.flujo||'')+'</td><td style="text-align:right">'+f(r.total)+'</td></tr>').join('');
  return '<div class="node">'+
    '<div class="node-row" onclick="toggle(this)">'+
      '<span class="caret">'+(hasKids?'▶':'')+'</span>'+
      '<span class="node-name">'+(depth===0?'<strong>':'')+esc(node.name)+(depth===0?'</strong>':'')+'</span>'+
      '<span class="node-qty">'+cif(node._cnt)+'</span>'+
      '<span class="node-total">'+f(node._tot)+'</span></div>'+
    (hasRegs?'<table class="regs"><thead><tr><th>Fecha</th><th>Referencia</th><th>Cliente</th><th>Flujo</th><th>Total</th></tr></thead><tbody>'+regsHTML+'</tbody></table>':'')+
    (hasKids?'<div class="children">'+kids+'</div>':'')+'</div>';
}
function render(){
  q=(document.getElementById('q').value||'').trim().toLowerCase();
  from=document.getElementById('from').value; to=document.getElementById('to').value;
  D.raices.forEach(r=>decorate(r,''));
  let tn=0,tm=0,tc=0;
  const sum=n=>{tn+=n._regs.length;n._regs.forEach(r=>tm+=r.total||0);if(n._regs.length)tc++;n.children.forEach(sum);};
  D.raices.forEach(sum);
  document.getElementById('body').innerHTML='<div class="tree">'+D.raices.map(n=>build(n,0)).join('')+'</div>';
  document.getElementById('k1').textContent=cif(tn);
  document.getElementById('k2').textContent=f(tm);
  document.getElementById('k3').textContent=cif(tc);
}
function toggle(el){
  const nd=el.closest('.node');
  const kids=nd.querySelector(':scope > .children');
  const regs=nd.querySelector(':scope > table.regs');
  const caret=nd.querySelector(':scope > .node-row .caret');
  let open=false;
  if(kids){open=kids.classList.toggle('open');if(regs)regs.classList.toggle('open',kids.classList.contains('open'));}
  else if(regs){open=regs.classList.toggle('open');}
  if(caret)caret.textContent=open?'▼':'▶';
}
function setAll(open){
  document.querySelectorAll('.children').forEach(c=>c.classList.toggle('open',open));
  document.querySelectorAll('table.regs').forEach(c=>c.classList.toggle('open',open));
  document.querySelectorAll('.caret').forEach(c=>c.textContent=open?'▼':'▶');
}
function allCsv(){
  const rows=[['Fecha','Referencia','Cliente','Flujo','Total','Cuenta']];
  const walk=(node,path)=>{
    node.regs.forEach(r=>rows.push([r.fecha||'',r.referencia||'',r.cliente||'',r.flujo||'',
      (r.total||0).toFixed(2),((path+' '+(node.name||'')).trim())]));
    node.children.forEach(c=>walk(c,path+' '+(node.name||'')));
  };
  D.raices.forEach(r=>walk(r,''));
  const escq=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(escq).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='balance_por_cuenta.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById('expand').onclick=()=>setAll(true);
document.getElementById('collapse').onclick=()=>setAll(false);
document.getElementById('csv').onclick=allCsv;
['q','from','to'].forEach(id=>document.getElementById(id).addEventListener('input',render));
render();
</script></body></html>
