name: Cuentas contables Flows
run-name: flows-${{ inputs.operation }}-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operación
        type: choice
        options: [verify, save]
        required: true
      request_id:
        description: Identificador único generado por Pages
        type: string
        required: true
      payload:
        description: Lotes JSON o comprobante de verificación
        type: string
        required: true

permissions:
  contents: read
  checks: write

jobs:
  cuentas:
    # Ejecutar exclusivamente el código de la rama predeterminada.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r scripts/requirements-flows.txt
      - name: Conectar por SSH y procesar lotes
        env:
          GH_TOKEN: ${{ github.token }}
          FLOWS_SIGNING_KEY: ${{ secrets.FLOWS_SIGNING_KEY }}
          SSH_HOST: ${{ secrets.FLOWS_SSH_HOST }}
          SSH_PORT: ${{ secrets.FLOWS_SSH_PORT }}
          SSH_USER: ${{ secrets.FLOWS_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.FLOWS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FLOWS_SSH_KNOWN_HOSTS }}
          PG_DATABASE: ${{ secrets.FLOWS_DB_NAME }}
          PG_USER: ${{ secrets.FLOWS_DB_USER }}
          PG_PASSWORD: ${{ secrets.FLOWS_DB_PASSWORD }}
          PG_HOST: 127.0.0.1
          PG_PORT: '5434'
        run: python scripts/flows_actions.py
